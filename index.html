<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F7F5" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('alongby-theme');
          var dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').content = dark ? '#141414' : '#F8F7F5';
        } catch (e) {}
      })();
    </script>
    <title>Alongby — Curated Project Marketplace</title>
    <meta name="description" content="A curated managed marketplace connecting clients with carefully matched digital and creative professionals." />
    <meta property="og:title" content="Alongby — Curated Project Marketplace" />
    <meta property="og:description" content="A curated managed marketplace connecting clients with carefully matched digital and creative professionals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
